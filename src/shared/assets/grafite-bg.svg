<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="tijolo" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#1b1518"/>
      <rect x="2" y="2" width="56" height="26" fill="#2a1d20"/>
      <rect x="62" y="2" width="56" height="26" fill="#241a1d"/>
      <rect x="-28" y="32" width="56" height="26" fill="#241a1d"/>
      <rect x="32" y="32" width="56" height="26" fill="#2c2023"/>
      <rect x="92" y="32" width="56" height="26" fill="#241a1d"/>
    </pattern>
    <radialGradient id="luz" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="spray" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="brilho"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- muro -->
  <rect width="1600" height="900" fill="url(#tijolo)"/>

  <!-- manchas de tinta (respingos) -->
  <g filter="url(#spray)" opacity="0.85">
    <circle cx="230" cy="180" r="120" fill="#ff5a1f" opacity="0.28"/>
    <circle cx="1350" cy="220" r="150" fill="#19c3ff" opacity="0.22"/>
    <circle cx="800" cy="560" r="170" fill="#b15cff" opacity="0.18"/>
    <circle cx="1250" cy="700" r="110" fill="#ffd400" opacity="0.2"/>
    <circle cx="250" cy="700" r="130" fill="#ff2e88" opacity="0.2"/>
  </g>

  <!-- grafite: BREAK -->
  <g filter="url(#spray)" font-family="Impact, 'Arial Black', sans-serif" font-style="italic" font-weight="900">
    <text x="90" y="300" font-size="210" fill="none" stroke="#000" stroke-width="22" stroke-linejoin="round" transform="rotate(-6 90 300)">BREAK</text>
    <text x="90" y="300" font-size="210" fill="#ff5a1f" stroke="#ffd400" stroke-width="5" stroke-linejoin="round" transform="rotate(-6 90 300)">BREAK</text>

    <text x="880" y="430" font-size="150" fill="none" stroke="#000" stroke-width="18" stroke-linejoin="round" transform="rotate(5 880 430)">HIP HOP</text>
    <text x="880" y="430" font-size="150" fill="#19c3ff" stroke="#fff" stroke-width="4" stroke-linejoin="round" transform="rotate(5 880 430)">HIP HOP</text>

    <text x="420" y="800" font-size="100" fill="none" stroke="#000" stroke-width="14" stroke-linejoin="round" transform="rotate(-3 420 800)">EVENTOS</text>
    <text x="420" y="800" font-size="100" fill="#b15cff" stroke="#ff2e88" stroke-width="4" stroke-linejoin="round" transform="rotate(-3 420 800)">EVENTOS</text>

    <text x="1180" y="810" font-size="80" fill="none" stroke="#000" stroke-width="10" transform="rotate(4 1180 810)">B-BOY</text>
    <text x="1180" y="810" font-size="80" fill="#ffd400" stroke="#ff5a1f" stroke-width="3" transform="rotate(4 1180 810)">B-BOY</text>
  </g>

  <!-- escorridos de tinta -->
  <g stroke-linecap="round" stroke-width="7" filter="url(#spray)">
    <line x1="150" y1="310" x2="150" y2="390" stroke="#ff5a1f"/>
    <line x1="330" y1="285" x2="330" y2="350" stroke="#ff5a1f"/>
    <line x1="560" y1="250" x2="560" y2="340" stroke="#ff5a1f"/>
    <line x1="960" y1="440" x2="960" y2="520" stroke="#19c3ff"/>
    <line x1="1210" y1="480" x2="1210" y2="545" stroke="#19c3ff"/>
    <line x1="500" y1="810" x2="500" y2="870" stroke="#b15cff"/>
  </g>

  <!-- estrelas e detalhes de tag -->
  <g fill="#ffd400" filter="url(#spray)">
    <path d="M60 80 l12 30 32 3 -25 20 8 31 -27 -17 -27 17 8 -31 -25 -20 32 -3z"/>
    <path d="M1480 90 l9 22 24 2 -18 15 6 23 -21 -13 -21 13 6 -23 -18 -15 24 -2z" fill="#ff2e88"/>
    <path d="M760 90 l8 20 22 2 -17 14 6 21 -19 -12 -19 12 6 -21 -17 -14 22 -2z" fill="#19c3ff"/>
  </g>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#spray)">
    <path d="M1000 120 q40 -50 80 0 t80 0"/>
    <path d="M100 520 q30 -40 60 0 t60 0" stroke="#ffd400"/>
  </g>

  <!-- b-boy fazendo freeze (silhueta) -->
  <g transform="translate(1180 470)" stroke="#0a0a0f" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <!-- brilho atrás -->
    <g stroke="#ff5a1f" stroke-width="30" opacity="0.5" filter="url(#brilho)">
      <path d="M0 150 L-10 60 L30 -10 M-10 60 L-60 20 M30 -10 L90 -60 M30 -10 L110 10"/>
    </g>
    <g stroke-width="20">
      <!-- braço de apoio -->
      <path d="M0 150 L-6 90 L-10 60"/>
      <!-- tronco -->
      <path d="M-10 60 L30 -10"/>
      <!-- pernas abertas -->
      <path d="M30 -10 L90 -60 L140 -40"/>
      <path d="M30 -10 L110 10 L160 -10"/>
      <!-- braço livre -->
      <path d="M-10 60 L-60 20 L-90 40"/>
    </g>
    <circle cx="-8" cy="38" r="17" fill="#0a0a0f" stroke="none"/>
    <path d="M-24 28 l32 -6" stroke="#ff5a1f" stroke-width="7"/>
    <!-- chão -->
    <ellipse cx="0" cy="158" rx="70" ry="9" fill="#000" stroke="none" opacity="0.6"/>
  </g>

  <!-- boombox -->
  <g transform="translate(110 640)" opacity="0.95">
    <rect width="190" height="100" rx="12" fill="#101015" stroke="#ff5a1f" stroke-width="4"/>
    <circle cx="48" cy="54" r="30" fill="#1d1d26" stroke="#ffd400" stroke-width="3"/>
    <circle cx="48" cy="54" r="10" fill="#ffd400"/>
    <circle cx="142" cy="54" r="30" fill="#1d1d26" stroke="#ffd400" stroke-width="3"/>
    <circle cx="142" cy="54" r="10" fill="#ffd400"/>
    <rect x="72" y="14" width="46" height="14" rx="3" fill="#19c3ff"/>
    <path d="M30 0 q-10 -30 30 -34 h70" fill="none" stroke="#ff5a1f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- vinheta escura para dar profundidade -->
  <rect width="1600" height="900" fill="url(#luz)"/>
</svg>
